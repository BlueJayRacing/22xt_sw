syntax = "proto3";
import "nanopb.proto";

// Single sample from the Teensy using the internal channel id.

message WsgData {
    uint64 time_val = 1;
    repeated uint32 wsgs = 2 [(nanopb).max_count = 3, (nanopb).fixed_count = true];
}

message Wsgs {
    repeated WsgData data = 1 [(nanopb).min_count = 1, (nanopb).max_count = 6]; // this is the number of wsgs we will send at once

}